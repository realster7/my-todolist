<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', Helvetica, Arial, sans-serif">
  <!-- ============================================================
       TodoList 할일 목록 화면 (데스크톱) — 4-wireframe.md 5장 레이아웃
       + 9-style.md 디자인 토큰(색상/타이포/간격) 결합 목업
       ============================================================ -->

  <!-- 배경 -->
  <rect x="0" y="0" width="900" height="560" fill="#FFFFFF"/>

  <!-- 전체 프레임 -->
  <rect x="20" y="20" width="860" height="520" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>

  <!-- ===== 헤더 (10.1 헤더/네비게이션) ===== -->
  <line x1="20" y1="84" x2="880" y2="84" stroke="#E8EAED" stroke-width="1"/>
  <text x="44" y="58" font-size="22" font-weight="500" fill="#202124">TodoList</text>

  <!-- + 할일 추가 (Primary 버튼) -->
  <rect x="140" y="34" width="112" height="36" rx="8" fill="#1A73E8"/>
  <text x="196" y="57" font-size="14" fill="#FFFFFF" text-anchor="middle">+ 할일 추가</text>

  <!-- 내 정보 / 로그아웃 (텍스트 링크) -->
  <text x="748" y="57" font-size="14" fill="#5F6368">내 정보</text>
  <text x="812" y="57" font-size="14" fill="#5F6368">로그아웃</text>

  <!-- ===== 필터 바 (UC-06) ===== -->
  <line x1="20" y1="140" x2="880" y2="140" stroke="#E8EAED" stroke-width="1"/>
  <text x="44" y="118" font-size="14" fill="#5F6368">카테고리</text>
  <rect x="112" y="98" width="88" height="32" rx="4" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
  <text x="156" y="119" font-size="14" fill="#202124" text-anchor="middle">전체 ▾</text>

  <!-- 상태 필터 버튼 그룹(라운드 사각형, radius-md=8): 전체(활성)/시작전/진행중/완료/지연 -->
  <rect x="220" y="98" width="60" height="32" rx="8" fill="#1A73E8"/>
  <text x="250" y="119" font-size="13" fill="#FFFFFF" text-anchor="middle">전체</text>

  <rect x="288" y="98" width="68" height="32" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
  <text x="322" y="119" font-size="13" fill="#5F6368" text-anchor="middle">시작전</text>

  <rect x="364" y="98" width="68" height="32" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
  <text x="398" y="119" font-size="13" fill="#5F6368" text-anchor="middle">진행중</text>

  <rect x="440" y="98" width="60" height="32" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
  <text x="470" y="119" font-size="13" fill="#5F6368" text-anchor="middle">완료</text>

  <rect x="508" y="98" width="60" height="32" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
  <text x="538" y="119" font-size="13" fill="#5F6368" text-anchor="middle">지연</text>

  <!-- ===== 할일 목록 카드 (5.3 카드) ===== -->
  <rect x="44" y="160" width="812" height="336" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>

  <!-- 행 1: 알고리즘 과제 — 진행중 (IN_PROGRESS, primary) -->
  <line x1="44" y1="244" x2="856" y2="244" stroke="#E8EAED" stroke-width="1"/>
  <circle cx="72" cy="202" r="9" fill="none" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="96" y="207" font-size="14" font-weight="500" fill="#202124">알고리즘 과제</text>
  <rect x="220" y="190" width="52" height="22" rx="4" fill="#F1F3F4"/>
  <text x="246" y="205" font-size="12" fill="#5F6368" text-anchor="middle">기본</text>
  <text x="440" y="207" font-size="14" fill="#5F6368">2026-08-26 ~ 09-02</text>
  <rect x="750" y="188" width="72" height="26" rx="999" fill="#E8F0FE"/>
  <text x="786" y="206" font-size="12" fill="#1A73E8" text-anchor="middle">진행중</text>

  <!-- 행 2: DB 프로젝트 발표자료 — 지연 (OVERDUE, danger) -->
  <line x1="44" y1="328" x2="856" y2="328" stroke="#E8EAED" stroke-width="1"/>
  <circle cx="72" cy="286" r="9" fill="none" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="96" y="291" font-size="14" font-weight="500" fill="#202124">DB 프로젝트 발표자료</text>
  <rect x="272" y="274" width="52" height="22" rx="4" fill="#F1F3F4"/>
  <text x="298" y="289" font-size="12" fill="#5F6368" text-anchor="middle">학업</text>
  <text x="440" y="291" font-size="14" fill="#5F6368">2026-08-20 ~ 08-25</text>
  <rect x="750" y="272" width="72" height="26" rx="999" fill="#FCE8E6"/>
  <text x="786" y="290" font-size="12" fill="#D93025" text-anchor="middle">지연</text>

  <!-- 행 3: 거래처 미팅 자료 정리 — 완료 (DONE, success), 체크됨 -->
  <line x1="44" y1="412" x2="856" y2="412" stroke="#E8EAED" stroke-width="1"/>
  <circle cx="72" cy="370" r="9" fill="#0F9D58" stroke="#0F9D58" stroke-width="1.5"/>
  <path d="M 68 370 L 71 373 L 77 366" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="375" font-size="14" font-weight="500" fill="#202124">거래처 미팅 자료 정리</text>
  <rect x="272" y="358" width="52" height="22" rx="4" fill="#F1F3F4"/>
  <text x="298" y="373" font-size="12" fill="#5F6368" text-anchor="middle">업무</text>
  <text x="440" y="375" font-size="14" fill="#5F6368">2026-08-10 ~ 08-20</text>
  <rect x="750" y="356" width="72" height="26" rx="999" fill="#E6F4EA"/>
  <text x="786" y="374" font-size="12" fill="#0F9D58" text-anchor="middle">완료</text>

  <!-- 행 4: 분기 보고서 작성 — 시작전 (NOT_STARTED, neutral) -->
  <circle cx="72" cy="454" r="9" fill="none" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="96" y="459" font-size="14" font-weight="500" fill="#202124">분기 보고서 작성</text>
  <rect x="238" y="442" width="52" height="22" rx="4" fill="#F1F3F4"/>
  <text x="264" y="457" font-size="12" fill="#5F6368" text-anchor="middle">업무</text>
  <text x="440" y="459" font-size="14" fill="#5F6368">2026-09-01 ~ 09-10</text>
  <rect x="742" y="440" width="80" height="26" rx="999" fill="#F1F3F4"/>
  <text x="782" y="458" font-size="12" fill="#5F6368" text-anchor="middle">시작전</text>
</svg>
